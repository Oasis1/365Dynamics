<html><head>
  <meta charset="utf-8">
  <title>RBKC Contact Warning Banner</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #05f656;
    }

    #warning-banner {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      min-height: 100%;
      display: none;
      padding: 12px 18px;
      background-color: #05f656;
      color: #000000;
      border: none;
      border-radius: 0;
      font-size: 16px;
    }

    .banner-title {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .banner-message {
      display: block;
      font-weight: 600;
      line-height: 1.4;
    }
  </style>
</head>

<body style="overflow-wrap: break-word;">

  <div id="warning-banner">
    <div class="banner-title">
      <strong>*** IMPORTANT CONTACT ALERT ***</strong>
    </div>

    <div class="banner-message">
      All communication must be approved by <strong>Daniel Lewis</strong> or <strong>Levi Burke</strong>.
      If both are unavailable, approval must be obtained from <strong>James Caspell</strong>.
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      const TARGET_CONTACT_ID = "0ad9a2c7-3315-e711-9417-005056bc7c30";

      function normalizeGuid(value) {
        return (value || "")
          .replace(/[{}]/g, "")
          .trim()
          .toLowerCase();
      }

      function getFormContext() {
        try {
          if (parent && parent.Xrm && parent.Xrm.Page) {
            return parent.Xrm.Page;
          }
        } catch (e) {
          console.error("Unable to access Dynamics form context:", e);
        }

        return null;
      }

      function updateBanner() {
        const banner = document.getElementById("warning-banner");
        const formContext = getFormContext();

        if (!banner) {
          return;
        }

        if (!formContext || !formContext.data || !formContext.data.entity) {
          banner.style.display = "none";
          setTimeout(updateBanner, 500);
          return;
        }

        try {
          const entityName = formContext.data.entity.getEntityName();

          if (entityName !== "contact") {
            banner.style.display = "none";
            return;
          }

          const currentContactId = normalizeGuid(
            formContext.data.entity.getId()
          );

          const targetContactId = normalizeGuid(
            TARGET_CONTACT_ID
          );

          if (currentContactId && currentContactId === targetContactId) {
            banner.style.display = "block";
          } else {
            banner.style.display = "none";
          }

        } catch (e) {
          console.error("RBKC Contact warning banner error:", e);
          banner.style.display = "none";
        }
      }

      window.addEventListener("load", function () {
        setTimeout(updateBanner, 300);
      });
    })();
  </script>


</body></html>
